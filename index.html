<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shalz demonlist</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --text: #e5e5e5;
      --text-dim: #a0a0a0;
      --highlight-bg: #000000;
      --highlight-text: #ffffff;
      --border: #2a2a2a;
      --accent: #64b5f6;
      --active-bg: #252525;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* 上方導覽列 */
    .top-nav {
      display: flex;
      gap: 32px;
      padding: 20px 40px;
      background-color: #0f0f0f;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-item {
      color: #888;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 500;
      padding-bottom: 6px;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .nav-item:hover {
      color: #e5e5e5;
    }

    .nav-item.active {
      color: #ffffff;
      border-bottom: 2px solid #ffffff;
    }

    .container {
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
      padding: 30px 20px;
      gap: 40px;
    }

    /* 左側排名區塊 */
    .ranking {
      width: 340px;
      flex-shrink: 0;
      max-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
    }

    .ranking h2 {
      font-size: 1.25rem;
      margin-bottom: 20px;
      color: var(--text);
      font-weight: 600;
      flex-shrink: 0;
    }

    .rank-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
      padding-right: 6px;
    }

    .rank-list::-webkit-scrollbar {
      width: 6px;
    }
    .rank-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .rank-list::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 3px;
    }
    .rank-list::-webkit-scrollbar-thumb:hover {
      background: #666;
    }

    .rank-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      margin-bottom: 6px;
      border-radius: 8px;
      transition: background 0.2s;
      cursor: pointer;
      user-select: none;
      gap: 8px;
    }

    .rank-item:hover {
      background: #222;
    }

    .rank-item.active {
      background: var(--active-bg);
      outline: 1px solid #333;
    }

    .rank-number {
      width: 36px;
      font-weight: 600;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    .rank-name {
      flex: 1;
      font-size: 0.95rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-points {
      font-size: 0.85rem;
      color: var(--text-dim);
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
    }

    .rank-item.highlight {
      background: var(--highlight-bg);
      color: var(--highlight-text);
    }

    .rank-item.highlight .rank-number {
      color: var(--highlight-text);
    }

    /* 右側內容區 */
    .main-content {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      min-height: 400px;
    }

    .level-title {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #fff;
    }

    .level-rank {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .victors-title {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--text);
      font-weight: 600;
    }

    .victors-list {
      list-style: none;
    }

    .victors-list li {
      padding: 8px 0;
      border-bottom: 1px solid #2a2a2a;
      color: var(--text);
    }

    .victors-list li:last-child {
      border-bottom: none;
    }

    .placeholder {
      color: var(--text-dim);
      font-size: 1rem;
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        padding: 20px 16px;
      }
      .ranking {
        width: 100%;
        max-height: 400px;
      }
    }
  </style>
</head>
<body>

  <!-- 上方導覽列 -->
  <nav class="top-nav">
    <a href="index.html" class="nav-item active">List</a>
    <a href="leaderboard.html" class="nav-item">Leaderboard</a>
  </nav>

  <div class="container">
    <!-- 左側排名 -->
    <aside class="ranking">
      <h2>shalz demonlist</h2>
      <ul class="rank-list" id="rankList">
        <!-- 由 data.js 與下方腳本自動生成，新增關卡會自動順延排名與分數 -->
      </ul>
    </aside>

    <!-- 右側主要內容 -->
    <main class="main-content" id="mainContent">
      <p class="placeholder">Welcome to shalz demonlist</p>
    </main>
  </div>

  <!-- 引入共用的關卡資料與計分邏輯 -->
  <script src="data.js"></script>
  <script>
    const rankList = document.getElementById("rankList");
    const mainContent = document.getElementById("mainContent");
    const totalLevels = levels.length;

    // 動態生成左側所有關卡列表
    levels.forEach((level, index) => {
      const rank = index + 1;
      const points = calculatePoints(rank, totalLevels);

      const item = document.createElement("li");
      item.className = "rank-item";
      item.innerHTML = `
        <span class="rank-number">#${rank}</span>
        <span class="rank-name">${level.name}</span>
        <span class="rank-points">${points} 分</span>
      `;

      item.addEventListener("click", () => {
        document.querySelectorAll(".rank-item").forEach(i => i.classList.remove("active"));
        item.classList.add("active");

        const victors = level.victors || [];
        let victorsHTML = "";
        if (victors.length === 0) {
          victorsHTML = `<li style="color: var(--text-dim);">目前還沒有人通關</li>`;
        } else {
          victors.forEach((player, idx) => {
            victorsHTML += `<li>${idx + 1}. ${player}</li>`;
          });
        }

        mainContent.innerHTML = `
          <h1 class="level-title">${level.name}</h1>
          <div class="level-rank">排名 #${rank}　・　${points} 分</div>
          <div class="victors-title">通關者列表</div>
          <ul class="victors-list">
            ${victorsHTML}
          </ul>
        `;
      });

      rankList.appendChild(item);
    });
  </script>
</body>
</html>
