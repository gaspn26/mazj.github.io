<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shalz demonlist</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --text: #e5e5e5;
      --text-dim: #a0a0a0;
      --highlight-bg: #000000;
      --highlight-text: #ffffff;
      --border: #2a2a2a;
      --accent: #64b5f6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }

    .container {
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      gap: 40px;
    }

    /* 左側排名區塊 */
    .ranking {
      width: 320px;
      flex-shrink: 0;
    }

    .ranking h2 {
      font-size: 1.25rem;
      margin-bottom: 20px;
      color: var(--text);
      font-weight: 600;
    }

    .rank-list {
      list-style: none;
    }

    .rank-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      margin-bottom: 6px;
      border-radius: 8px;
      transition: background 0.2s;
      cursor: default;
    }

    .rank-item:hover {
      background: #222;
    }

    /* 排名號碼 */
    .rank-number {
      width: 36px;
      font-weight: 600;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    /* 關卡名稱 */
    .rank-name {
      flex: 1;
      font-size: 0.95rem;
    }

    /* 高亮項目（目前沒用到，保留以後需要時可加 class="highlight"） */
    .rank-item.highlight {
      background: var(--highlight-bg);
      color: var(--highlight-text);
    }

    .rank-item.highlight .rank-number {
      color: var(--highlight-text);
    }

    /* 右側內容區 */
    .main-content {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      min-height: 400px;
    }

    .main-content h1 {
      font-size: 1.8rem;
      margin-bottom: 12px;
    }

    .main-content p {
      color: var(--text-dim);
    }

    /* 手機版調整 */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        padding: 20px 16px;
      }

      .ranking {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 左側排名 -->
    <aside class="ranking">
      <h2>shalz demonlist</h2>
      <ul class="rank-list">
        <li class="rank-item">
          <span class="rank-number">#1</span>
          <span class="rank-name">Lesopowal</span>
        </li>
        <li class="rank-item">
          <span class="rank-number">#2</span>
          <span class="rank-name">SARY NEVER CLEAR (Original)</span>
        </li>
        <li class="rank-item">
          <span class="rank-number">#3</span>
          <span class="rank-name">Sukupen circles (Unnerfed)</span>
        </li>
        <li class="rank-item">
          <span class="rank-number">#4</span>
          <span class="rank-name">Herr Machine</span>
        </li>
        <li class="rank-item">
          <span class="rank-number">#5</span>
          <span class="rank-name">Old Orochi</span>
        </li>
        <li class="rank-item">
          <span class="rank-number">#6</span>
          <span class="rank-name">Azure Flare (ItsHybrid)</span>
        </li>
        <li class="rank-item">
          <span class="rank-number">#7</span>
          <span class="rank-name">SANGUINE</span>
        </li>
      </ul>
    </aside>

  </div>
</body>
</html>
