<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shalz demonlist</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --text: #e5e5e5;
      --text-dim: #a0a0a0;
      --highlight-bg: #000000;
      --highlight-text: #ffffff;
      --border: #2a2a2a;
      --accent: #64b5f6;
      --active-bg: #252525;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }

    .container {
      display: flex;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      gap: 40px;
    }

    /* 左側排名區塊 */
    .ranking {
      width: 320px;
      flex-shrink: 0;
    }

    .ranking h2 {
      font-size: 1.25rem;
      margin-bottom: 20px;
      color: var(--text);
      font-weight: 600;
    }

    .rank-list {
      list-style: none;
    }

    .rank-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      margin-bottom: 6px;
      border-radius: 8px;
      transition: background 0.2s;
      cursor: pointer;
      user-select: none;
    }

    .rank-item:hover {
      background: #222;
    }

    /* 目前被選中的項目 */
    .rank-item.active {
      background: var(--active-bg);
      outline: 1px solid #333;
    }

    /* 排名號碼 */
    .rank-number {
      width: 36px;
      font-weight: 600;
      color: var(--text-dim);
      flex-shrink: 0;
    }

    /* 關卡名稱 */
    .rank-name {
      flex: 1;
      font-size: 0.95rem;
    }

    /* 高亮項目（目前沒用到，保留以後需要時可加 class="highlight"） */
    .rank-item.highlight {
      background: var(--highlight-bg);
      color: var(--highlight-text);
    }

    .rank-item.highlight .rank-number {
      color: var(--highlight-text);
    }

    /* 右側內容區 */
    .main-content {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      min-height: 400px;
    }

    .level-title {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: #fff;
    }

    .level-rank {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }

    .victors-title {
      font-size: 1.1rem;
      margin-bottom: 12px;
      color: var(--text);
      font-weight: 600;
    }

    .victors-list {
      list-style: none;
    }

    .victors-list li {
      padding: 8px 0;
      border-bottom: 1px solid #2a2a2a;
      color: var(--text);
    }

    .victors-list li:last-child {
      border-bottom: none;
    }

    .placeholder {
      color: var(--text-dim);
      font-size: 1rem;
    }

    /* 手機版調整 */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
        padding: 20px 16px;
      }

      .ranking {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 左側排名 -->
    <aside class="ranking">
      <h2>shalz demonlist</h2>
      <ul class="rank-list" id="rankList">
        <li class="rank-item" data-rank="1">
          <span class="rank-number">#1</span>
          <span class="rank-name">The Yandere</span>
        </li>
        <li class="rank-item" data-rank="2">
          <span class="rank-number">#2</span>
          <span class="rank-name">Sonic Wave Rebirth</span>
        </li>
        <li class="rank-item" data-rank="3">
          <span class="rank-number">#3</span>
          <span class="rank-name">Sonic Wave</span>
        </li>
        <li class="rank-item" data-rank="4">
          <span class="rank-number">#4</span>
          <span class="rank-name">Devil Vortex</span>
        </li>
        <li class="rank-item" data-rank="5">
          <span class="rank-number">#5</span>
          <span class="rank-name">Killbot</span>
        </li>
        <li class="rank-item" data-rank="6">
          <span class="rank-number">#6</span>
          <span class="rank-name">Delta Interface</span>
        </li>
        <li class="rank-item" data-rank="7">
          <span class="rank-number">#7</span>
          <span class="rank-name">cloud</span>
        </li>
        <li class="rank-item" data-rank="8">
          <span class="rank-number">#8</span>
          <span class="rank-name">The Hell Zone</span>
        </li>
        <li class="rank-item" data-rank="9">
          <span class="rank-number">#9</span>
          <span class="rank-name">Auditory Breaker</span>
        </li>
        <li class="rank-item" data-rank="10">
          <span class="rank-number">#10</span>
          <span class="rank-name">Worse Trip</span>
        </li>
        <li class="rank-item" data-rank="11">
          <span class="rank-number">#11</span>
          <span class="rank-name">Athanatos</span>
        </li>
      </ul>
    </aside>

    <!-- 右側主要內容 -->
    <main class="main-content" id="mainContent">
      <p class="placeholder">請點選左邊的關卡來查看詳細資訊</p>
    </main>
  </div>

  <script>
  // ============================================
  // 在這裡設定每個關卡的通關者
  // key 要用關卡的完整名稱（跟左邊顯示的一樣）
  // ============================================
  const levelData = {
    "The Yandere": {
      victors: ["阿茲"]
    },
    "Sonic Wave Rebirth": {
      victors: ["阿茲"]
    },
    "Sonic Wave": {
      victors: ["阿茲"]
    },
    "Devil Vortex": {
      victors: ["Yuii"]
    },
    "Killbot": {
      victors: ["HankK漢"]
    },
    "Delta Interface": {
      victors: ["Yuii"]          // 還沒人通關就留空陣列
    },
    "cloud": {
      victors: ["阿茲"]
    },
    "The Hell Zone": {
      victors: ["Mazj"]
    },
    "Auditory Breaker": {
      victors: ["阿茲"]
    },
    "Worse Trip": {
      victors: ["阿茲"]
    },
    "Athanatos": {
      victors: ["HankK漢"]
    }
  };

  // ============================================
  // 下面的程式不用動
  // ============================================
  const rankItems = document.querySelectorAll(".rank-item");
  const mainContent = document.getElementById("mainContent");

  rankItems.forEach(item => {
    item.addEventListener("click", () => {
      // 移除所有 active
      rankItems.forEach(i => i.classList.remove("active"));
      // 幫目前點的加上 active
      item.classList.add("active");

      const rank = item.dataset.rank;
      const name = item.querySelector(".rank-name").textContent;

      // 取得這個關卡的通關者資料
      const data = levelData[name] || { victors: [] };
      const victors = data.victors;

      // 產生通關者列表 HTML
      let victorsHTML = "";
      if (victors.length === 0) {
        victorsHTML = `<li style="color: var(--text-dim);">目前還沒有人通關</li>`;
      } else {
        victors.forEach((player, index) => {
          victorsHTML += `<li>${index + 1}. ${player}</li>`;
        });
      }

      // 顯示右邊內容
      mainContent.innerHTML = `
        <h1 class="level-title">${name}</h1>
        <div class="level-rank">排名 #${rank}</div>
        
        <div class="victors-title">通關者列表</div>
        <ul class="victors-list">
          ${victorsHTML}
        </ul>
      `;
    });
  });
</script>
</body>
</html>
