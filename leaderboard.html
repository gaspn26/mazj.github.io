<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shalz demonlist - Leaderboard</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --text: #e5e5e5;
      --text-dim: #a0a0a0;
      --border: #2a2a2a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* 上方導覽列 */
    .top-nav {
      display: flex;
      gap: 32px;
      padding: 20px 40px;
      background-color: #0f0f0f;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-item {
      color: #888;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 500;
      padding-bottom: 6px;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .nav-item:hover {
      color: #e5e5e5;
    }

    .nav-item.active {
      color: #ffffff;
      border-bottom: 2px solid #ffffff;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 24px;
    }

    .placeholder {
      color: var(--text-dim);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- 上方導覽列 -->
  <nav class="top-nav">
    <a href="index.html" class="nav-item">List</a>
    <a href="leaderboard.html" class="nav-item active">Leaderboard</a>
  </nav>

  <div class="container">
    <h1>Leaderboard</h1>
    <div class="placeholder">
      WIP
    </div>
  </div>

</body>
</html>
