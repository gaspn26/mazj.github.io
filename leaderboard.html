<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shalz demonlist - Leaderboard</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --text: #e5e5e5;
      --text-dim: #a0a0a0;
      --border: #2a2a2a;
      --accent: #64b5f6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* 上方導覽列 */
    .top-nav {
      display: flex;
      gap: 32px;
      padding: 20px 40px;
      background-color: #0f0f0f;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-item {
      color: #888;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 500;
      padding-bottom: 6px;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .nav-item:hover {
      color: #e5e5e5;
    }

    .nav-item.active {
      color: #ffffff;
      border-bottom: 2px solid #ffffff;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-dim);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    /* Leaderboard 表格 */
    .leaderboard {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .leaderboard th {
      text-align: left;
      padding: 14px 18px;
      background: #151515;
      color: var(--text-dim);
      font-weight: 500;
      font-size: 0.9rem;
    }

    .leaderboard td {
      padding: 14px 18px;
      border-top: 1px solid #2a2a2a;
    }

    .leaderboard tr:hover td {
      background: #222;
    }

    .rank-cell {
      width: 70px;
      font-weight: 600;
      color: var(--text-dim);
    }

    .player-cell {
      font-weight: 500;
    }

    .points-cell {
      font-weight: 600;
      color: #fff;
    }

    .clears-cell {
      color: var(--text-dim);
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <!-- 上方導覽列 -->
  <nav class="top-nav">
    <a href="index.html" class="nav-item">List</a>
    <a href="leaderboard.html" class="nav-item active">Leaderboard</a>
  </nav>

  <div class="container">
    <h1>Leaderboard</h1>
    <p class="subtitle">分數系統：#1 = 300 分 → 最後一關 = 1 分（線性分配，四捨五入）</p>

    <table class="leaderboard" id="leaderboardTable">
      <thead>
        <tr>
          <th>排名</th>
          <th>玩家</th>
          <th>總分</th>
          <th>通關數</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody">
        <!-- 由 JavaScript 自動生成 -->
      </tbody>
    </table>
  </div>

  <script>
    // ============================================
    // 在這裡填入關卡資料（依照排名順序）
    // 之後新增關卡只要往陣列後面加即可
    // ============================================
    const levels = [
      { name: "shimmer (amplitron)", victors: ["阿茲"] },
      { name: "The Yandere", victors: ["阿茲"] },
      { name: "Sonic Wave Rebirth", victors: ["阿茲"] },
      { name: "Bloodbath", victors: ["FuzzearZ", "阿茲", "Lucas70707", "Yuii"] },
    ];

    // ============================================
    // 下面的計算邏輯通常不需要修改
    // ============================================

    function calculatePoints(rank, totalLevels) {
      if (totalLevels <= 1) return 300;
      const points = 300 - (rank - 1) * (299 / (totalLevels - 1));
      return Math.round(points);
    }

    function generateLeaderboard() {
      const totalLevels = levels.length;
      const playerStats = {}; // { 玩家名稱: { points: 0, clears: 0 } }

      // 計算每位玩家的分數與通關數
      levels.forEach((level, index) => {
        const rank = index + 1;
        const points = calculatePoints(rank, totalLevels);

        level.victors.forEach(player => {
          if (!playerStats[player]) {
            playerStats[player] = { points: 0, clears: 0 };
          }
          playerStats[player].points += points;
          playerStats[player].clears += 1;
        });
      });

      // 轉成陣列並排序（分數高 → 低）
      const sortedPlayers = Object.entries(playerStats)
        .map(([name, stats]) => ({
          name,
          points: stats.points,
          clears: stats.clears
        }))
        .sort((a, b) => b.points - a.points || b.clears - a.clears);

      // 渲染表格
      const tbody = document.getElementById("leaderboardBody");

      if (sortedPlayers.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="empty">
              目前還沒有通關資料<br>
              請在 levels 陣列中新增關卡與通關者
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = sortedPlayers.map((player, index) => `
        <tr>
          <td class="rank-cell">#${index + 1}</td>
          <td class="player-cell">${player.name}</td>
          <td class="points-cell">${player.points}</td>
          <td class="clears-cell">${player.clears}</td>
        </tr>
      `).join("");
    }

    // 啟動
    generateLeaderboard();
  </script>
</body>
</html>
