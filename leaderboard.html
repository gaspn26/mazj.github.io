<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>shalz demonlist - Leaderboard</title>
  <style>
    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --text: #e5e5e5;
      --text-dim: #a0a0a0;
      --border: #2a2a2a;
      --accent: #64b5f6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
    }

    .top-nav {
      display: flex;
      gap: 32px;
      padding: 20px 40px;
      background-color: #0f0f0f;
      border-bottom: 1px solid #222;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-item {
      color: #888;
      text-decoration: none;
      font-size: 1.05rem;
      font-weight: 500;
      padding-bottom: 6px;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }

    .nav-item:hover {
      color: #e5e5e5;
    }

    .nav-item.active {
      color: #ffffff;
      border-bottom: 2px solid #ffffff;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-dim);
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    .leaderboard {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .leaderboard th {
      text-align: left;
      padding: 14px 18px;
      background: #151515;
      color: var(--text-dim);
      font-weight: 500;
      font-size: 0.9rem;
    }

    .leaderboard td {
      padding: 14px 18px;
      border-top: 1px solid #2a2a2a;
    }

    .leaderboard tr {
      cursor: pointer;
      transition: background 0.15s;
    }

    .leaderboard tr:hover td {
      background: #222;
    }

    .leaderboard tr.active td {
      background: #2a2a2a;
    }

    .rank-cell {
      width: 70px;
      font-weight: 600;
      color: var(--text-dim);
    }

    .player-cell {
      font-weight: 500;
    }

    .points-cell {
      font-weight: 600;
      color: #fff;
    }

    .clears-cell {
      color: var(--text-dim);
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-dim);
    }

    .player-detail {
      margin-top: 30px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: none;
    }

    .player-detail.show {
      display: block;
    }

    .player-detail h2 {
      font-size: 1.3rem;
      margin-bottom: 6px;
    }

    .player-detail .detail-sub {
      color: var(--text-dim);
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .cleared-list {
      list-style: none;
    }

    .cleared-list li {
      padding: 10px 0;
      border-bottom: 1px solid #2a2a2a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cleared-list li:last-child {
      border-bottom: none;
    }

    .cleared-rank {
      color: var(--text-dim);
      width: 50px;
      flex-shrink: 0;
    }

    .cleared-name {
      flex: 1;
    }

    .cleared-points {
      color: var(--text-dim);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <nav class="top-nav">
    <a href="index.html" class="nav-item">List</a>
    <a href="leaderboard.html" class="nav-item active">Leaderboard</a>
  </nav>

  <div class="container">
    <h1>Leaderboard</h1>
    <p class="subtitle">分數系統：f(x) = 300 ^ ((l - x) / (l - 1))（指數分配，四捨五入到小數）</p>

    <table class="leaderboard" id="leaderboardTable">
      <thead>
        <tr>
          <th>排名</th>
          <th>玩家</th>
          <th>總分</th>
          <th>通關數</th>
        </tr>
      </thead>
      <tbody id="leaderboardBody">
        <!-- 自動由 JavaScript 生成 -->
      </tbody>
    </table>

    <div class="player-detail" id="playerDetail">
      <h2 id="detailTitle">玩家通關列表</h2>
      <p class="detail-sub" id="detailSub"></p>
      <ul class="cleared-list" id="clearedList"></ul>
    </div>
  </div>

  <!-- 引入共用資料檔案 -->
  <script src="data.js"></script>
  <script>
    function generateLeaderboard() {
      const totalLevels = levels.length;
      const playerStats = {};

      levels.forEach((level, index) => {
        const rank = index + 1;
        const points = calculatePoints(rank, totalLevels);

        level.victors.forEach(player => {
          if (!playerStats[player]) {
            playerStats[player] = {
              points: 0,
              clears: 0,
              levels: []
            };
          }
          playerStats[player].points = Math.round((playerStats[player].points + points) * 10) / 10;
          playerStats[player].clears += 1;
          playerStats[player].levels.push({
            rank: rank,
            name: level.name,
            points: points
          });
        });
      });

      const sortedPlayers = Object.entries(playerStats)
        .map(([name, stats]) => ({
          name,
          points: stats.points,
          clears: stats.clears,
          levels: stats.levels.sort((a, b) => a.rank - b.rank)
        }))
        .sort((a, b) => b.points - a.points || b.clears - a.clears);

      const tbody = document.getElementById("leaderboardBody");
      const detailBox = document.getElementById("playerDetail");

      if (sortedPlayers.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="4" class="empty">
              目前還沒有通關資料
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = sortedPlayers.map((player, index) => `
        <tr data-player="${player.name}">
          <td class="rank-cell">#${index + 1}</td>
          <td class="player-cell">${player.name}</td>
          <td class="points-cell">${player.points}</td>
          <td class="clears-cell">${player.clears}</td>
        </tr>
      `).join("");

      document.querySelectorAll("#leaderboardBody tr").forEach(row => {
        row.addEventListener("click", () => {
          document.querySelectorAll("#leaderboardBody tr").forEach(r => r.classList.remove("active"));
          row.classList.add("active");

          const playerName = row.dataset.player;
          const player = sortedPlayers.find(p => p.name === playerName);

          document.getElementById("detailTitle").textContent = playerName + " 的通關列表";
          document.getElementById("detailSub").textContent = `總分 ${player.points} ・ 通關 ${player.clears} 關`;

          const list = document.getElementById("clearedList");
          list.innerHTML = player.levels.map(lv => `
            <li>
              <span class="cleared-rank">#${lv.rank}</span>
              <span class="cleared-name">${lv.name}</span>
              <span class="cleared-points">${lv.points} 分</span>
            </li>
          `).join("");

          detailBox.classList.add("show");
        });
      });
    }

    generateLeaderboard();
  </script>
</body>
</html>
